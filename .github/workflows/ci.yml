name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Node 22 LTS. Antes era 24 porque `npm ci` con npm 10 abortaba por el conflicto de
      # peers de `pinia@2` vs `vue-router@5` (`Missing: pinia@4.0.3`). FE-014b subió
      # `pinia` a `^4` → el árbol ideal de npm 10/11 coincide con el lockfile y se puede
      # volver a una LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Falla el CI ante una vulnerabilidad alta/crítica nueva. Nivel "high" (no "moderate")
      # para no bloquear por la moderada aceptada de `@nuxt/ui` (ver README, "Vulnerabilidades
      # de dependencias aceptadas"). Ver plan FE-014.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      # Genera `.nuxt/` (tipos, tsconfig y `.nuxt/eslint.config.mjs` que importa
      # `eslint.config.mjs`). Sin esto, lint y typecheck fallan en un checkout limpio.
      - name: Preparar Nuxt
        run: npx nuxt prepare

      - name: Lint
        run: npm run lint

      # `vue-tsc` emite un warning conocido y no fatal al resolver el plugin
      # `vue-router/volar/sfc-route-blocks` (desfase de versión con vue-router);
      # sale con exit 0 y sí type-checkea el resto. Si algún día rompe el CI,
      # cambiar a `npm run typecheck || true` con un issue para quitarlo.
      - name: Type-check
        run: npm run typecheck

      - name: Configuración de API para CI
        run: sed -i 's#https://BACKEND-DOMAIN.example#https://api.example.test#g' public/_headers

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: https://api.example.test/api/v1

      - name: Tests
        run: npm run test
