name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 (npm 11) a propósito, no 20 como el backend: el package-lock.json
      # (lockfileVersion 3, generado con npm 11) resuelve limpio con `npm ci` bajo
      # npm 11, pero npm 10 (Node 20) calcula un árbol ideal distinto y aborta con
      # "Missing: pinia@4.0.3 from lock file". La higiene a fondo del árbol de
      # dependencias del frontend es el plan FE-014.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Falla el CI ante una vulnerabilidad alta/crítica nueva. Nivel "high" (no "moderate")
      # para no bloquear por la moderada aceptada de `@nuxt/ui` (ver README, "Vulnerabilidades
      # de dependencias aceptadas"). Ver plan FE-014.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      # Genera `.nuxt/` (tipos, tsconfig y `.nuxt/eslint.config.mjs` que importa
      # `eslint.config.mjs`). Sin esto, lint y typecheck fallan en un checkout limpio.
      - name: Preparar Nuxt
        run: npx nuxt prepare

      - name: Lint
        run: npm run lint

      # `vue-tsc` emite un warning conocido y no fatal al resolver el plugin
      # `vue-router/volar/sfc-route-blocks` (desfase de versión con vue-router);
      # sale con exit 0 y sí type-checkea el resto. Si algún día rompe el CI,
      # cambiar a `npm run typecheck || true` con un issue para quitarlo.
      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
